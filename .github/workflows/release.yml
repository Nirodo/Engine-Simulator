name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Windows-Installer und portable EXE bauen
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Web-Version beilegen
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp dist/web/Engine-Simulator.html "release/Engine-Simulator-${VERSION}-web.html"
      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Engine-Simulator ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/Engine-Simulator-Setup-*.exe
            release/Engine-Simulator-*-portable.exe
            release/Engine-Simulator-*-web.html
      - name: Artefakte bei manuellem Lauf hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-simulator-windows
          path: |
            release/*.exe
            release/*-web.html
