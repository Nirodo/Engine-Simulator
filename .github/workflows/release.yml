name: Release

# Ein Release entsteht automatisch, sobald auf main eine Version in package.json steht,
# zu der es noch kein Release gibt. Alternativ per Tag v* oder manuell.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION existiert bereits."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Windows-Installer und portable EXE bauen
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Web-Version beilegen
        shell: bash
        run: cp dist/web/Engine-Simulator.html "release/Engine-Simulator-${{ needs.check.outputs.version }}-web.html"
      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Engine-Simulator ${{ needs.check.outputs.version }}
          body_path: docs/releases/v${{ needs.check.outputs.version }}.md
          make_latest: true
          files: |
            release/Engine-Simulator-Setup-*.exe
            release/Engine-Simulator-*-portable.exe
            release/Engine-Simulator-*-web.html
